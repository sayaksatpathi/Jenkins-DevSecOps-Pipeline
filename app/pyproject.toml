[tool.ruff]
target-version = "py312"
line-length    = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S"]
ignore = [
    "S101",   # allow assert in tests
    "S104",   # allow 0.0.0.0 bind — deliberate for container
]

[tool.pytest.ini_options]
testpaths   = ["tests"]
python_files = ["test_*.py"]
